name: 'AI PR Summarizer'
description: 'Automatically summarizes pull request diffs using OpenAI and posts a structured comment.'
author: 'Your Name or Organization'
branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  openai-api-key:
    description: 'OpenAI API key for calling gpt-4o-mini. If not provided, the action will use the default OpenAI API base URL.'
    required: true
  github-token:
    description: 'GitHub token (github.token) with permissions to read PRs and post comments.'
    required: true
    default: ${{ github.token }}
  base-url:
    description: 'OpenAI API base URL. If not provided, the action will use the default OpenAI API base URL.'
    required: false
    default: 'https://api.openai.com/v1'

runs:
  using: 'node20'
  main: 'dist/index.js'
